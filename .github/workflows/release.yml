name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: read

jobs:
  build:
    name: Build ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: aarch64-apple-darwin
            os: macos-15
          - target: x86_64-apple-darwin
            os: macos-15-intel
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-22.04
          - target: aarch64-unknown-linux-gnu
            os: ubuntu-22.04-arm
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Install Rust
        run: rustup toolchain install stable --profile minimal --no-self-update
      - name: Build release
        env:
          TARGET: ${{ matrix.target }}
        run: |
          rustup target add --toolchain stable "$TARGET"
          cargo +stable build --locked --release -p navarch-cli --target "$TARGET"
      - name: Package
        env:
          TARGET: ${{ matrix.target }}
        run: |
          version=${GITHUB_REF_NAME#v}
          crate_version=$(cargo +stable metadata --no-deps --format-version 1 | python3 -c 'import json,sys; print(next(p["version"] for p in json.load(sys.stdin)["packages"] if p["name"] == "navarch-cli"))')
          test "$version" = "$crate_version"
          mkdir -p dist package
          cp "target/$TARGET/release/navarch" LICENSE README.md package/
          tar -czf "dist/navarch-$version-$TARGET.tar.gz" -C package navarch LICENSE README.md
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: navarch-${{ matrix.target }}
          path: dist/*.tar.gz
          if-no-files-found: error

  release:
    needs: build
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          pattern: navarch-*
          merge-multiple: true
          path: dist
      - name: Checksums and GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          cd dist
          sha256sum navarch-*.tar.gz > SHA256SUMS
          gh release create "$GITHUB_REF_NAME" --verify-tag --generate-notes navarch-*.tar.gz SHA256SUMS
