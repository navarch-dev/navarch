[workspace]
members = ["crates/*"]
resolver = "3"

[workspace.package]
version = "0.0.0"
edition = "2024"
rust-version = "1.88"
license = "Apache-2.0"
repository = "https://github.com/navarch-dev/navarch"

[workspace.dependencies]
agent-client-protocol = { version = "5.1.0", features = ["process"] }
anyhow = "1.0"
clap = { version = "4.5", features = ["derive"] }
data-encoding = "2.9"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tempfile = "3.23"
thiserror = "2.0"
tokio = { version = "1.52", features = ["macros", "rt"] }
uuid = { version = "1.18", features = ["serde"] }

[workspace.lints.rust]
unsafe_code = "deny"
missing_docs = "warn"

[workspace.lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
