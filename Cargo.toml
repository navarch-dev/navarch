[workspace]
members = ["crates/*"]
resolver = "3"

[workspace.package]
version = "0.0.0"
edition = "2024"
rust-version = "1.88"
license = "Apache-2.0"
repository = "https://github.com/navarch-dev/navarch"

[workspace.dependencies]
agent-client-protocol = { version = "5.1.0", features = ["process"] }
async-trait = "0.1"
rustix = { version = "1.1", features = ["fs"] }
toml = "0.8"
tracing = "0.1"
anyhow = "1.0"
clap = { version = "4.5", features = ["derive"] }
data-encoding = "2.9"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tempfile = "3.23"
thiserror = "2.0"
tokio = { version = "1.52", features = ["macros", "rt-multi-thread", "sync", "time", "process", "io-util", "io-std", "test-util"] }
uuid = { version = "1.18", features = ["serde", "v4"] }

navarch-proto = { path = "crates/navarch-proto" }
navarch-policy = { path = "crates/navarch-policy" }
navarch-acp = { path = "crates/navarch-acp" }
navarch-worker = { path = "crates/navarch-worker" }

[workspace.lints.rust]
unsafe_code = "deny"
missing_docs = "warn"

[workspace.lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
